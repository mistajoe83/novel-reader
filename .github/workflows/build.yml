name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      apk_ok: ${{ steps.apk.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the novel sites (live)
        run: ./gradlew :core:test -DliveTests=true --continue > core-test.log 2>&1 || true

      - name: Build APK
        id: apk
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Upload APK
        if: steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/*.apk

      - name: Save results to the ci-results branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp core-test.log /tmp/out/ 2>/dev/null || true
          cp core/build/live-report.md /tmp/out/ 2>/dev/null || true
          if [ -f build.log ]; then
            tail -c 300000 build.log > /tmp/out/build-tail.log
            grep -E "^e: |^w: .*(deprecated|unused)|error:|FAILURE|What went wrong|Exception" -A4 build.log | head -c 200000 > /tmp/out/errors.txt || true
          fi
          echo "commit=${GITHUB_SHA} apk=${{ steps.apk.outcome }} run=${GITHUB_RUN_NUMBER}" > /tmp/out/status.txt
          ls -la app/build/outputs/apk/release/ >> /tmp/out/status.txt 2>/dev/null || true
          cd /tmp/out
          git init -q
          git checkout -q -b ci-results
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "CI results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-results

      - name: Fail if the APK didn't build
        if: steps.apk.outcome != 'success'
        run: exit 1

      - name: Publish release
        if: steps.apk.outcome == 'success' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v1.0.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk "NovelNest-${V}.apk"
          gh release create "$V" "NovelNest-${V}.apk" \
            --title "NovelNest ${V}" \
            --notes "Install: download NovelNest-${V}.apk on your phone and open it. Built from ${GITHUB_SHA::7}." \
            --latest

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=always"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/smoke.sh shots

      - name: Save screenshots to the ci-results branch
        if: always()
        run: |
          git config --global user.name ci
          git config --global user.email ci@users.noreply.github.com
          git clone --depth 1 --branch ci-results "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/res
          rm -rf /tmp/res/shots
          cp -r shots /tmp/res/shots 2>/dev/null || mkdir -p /tmp/res/shots
          cd /tmp/res
          git add -A
          git commit -qm "Emulator screenshots for ${GITHUB_SHA}" || true
          git push origin ci-results
